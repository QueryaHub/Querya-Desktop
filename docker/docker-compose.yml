# Querya Desktop — local database stack for manual testing.
#
# Start:
#   cd docker && docker compose up -d
#
# Stop and remove volumes (re-run init scripts on next up):
#   docker compose down -v
#
# ── Connection cheat sheet (host: localhost) ─────────────────────────────
# PostgreSQL  port 5432  db querya       user querya  password querya
#              schemas: shop.* + database analytics
# MySQL       port 3306  db querya       user querya  password querya
#              extra database: analytics
# Redis       port 6379  no auth         keys prefix querya:*
# MongoDB     port 27017 db querya       user querya  password querya
#              auth source: admin        collections: users, products, orders
# ClickHouse  HTTP 8123 / native 9000    db querya  user querya  password querya
#              tables: customers, products, orders, order_lines, events
# SQLite      local file ./sqlite/data/querya.db
#              tables: users, products, orders
# ─────────────────────────────────────────────────────────────────────────

name: querya-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: querya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-querya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-querya}
      POSTGRES_DB: ${POSTGRES_DB:-querya}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-querya} -d ${POSTGRES_DB:-querya}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    container_name: querya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-querya}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-querya}
      MYSQL_USER: ${MYSQL_USER:-querya}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-querya}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u${MYSQL_USER:-querya}",
          "-p${MYSQL_PASSWORD:-querya}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: querya-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-seed:
    image: redis:7-alpine
    container_name: querya-redis-seed
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./redis/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    restart: "no"

  mongo:
    image: mongo:7
    container_name: querya-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-querya}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-querya}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME:-querya}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD:-querya}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: querya-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-querya}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-querya}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-querya}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user $${CLICKHOUSE_USER:-querya} --password $${CLICKHOUSE_PASSWORD:-querya} --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  sqlite-seed:
    image: alpine:latest
    container_name: querya-sqlite-seed
    volumes:
      - ./sqlite/data:/data
      - ./sqlite/init.sql:/init.sql:ro
    command: >
      sh -c "apk add --no-cache sqlite && sqlite3 /data/querya.db < /init.sql && chmod 666 /data/querya.db && echo 'SQLite DB seeded'"
    restart: "no"

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  mongo_data:
  clickhouse_data:
