name: querya_desktop
description: Lightweight desktop SQL/NoSQL client. Flutter (Dart).
version: 0.4.11-c




environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  refresh_rate: ^1.0.2
  shadcn_flutter: ^0.0.52
  bitsdojo_window: ^0.1.6
  path: ^1.9.0
  path_provider: ^2.1.5

  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.4.2
  mongo_dart: ^0.10.8
  redis: ^4.0.0
  postgres: ^3.5.6
  fl_chart: ^1.2.0
  mysql_client: ^0.0.27
  flutter_secure_storage: ^10.3.1
  file_selector: ^1.1.0
  syntax_highlight: ^0.5.0
  archive: ^4.2.0
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used in tests to mock paths (path_provider has no plugin in flutter test).
  path_provider_platform_interface: ^2.1.2

dependency_overrides:
  # Patched mysql_client: optional SecurityContext for client TLS certificates.
  mysql_client:
    path: third_party/mysql_client
  # Patched ToastLayer (fixes InheritedNotifier crash on resize / hot reload).
  shadcn_flutter:
    path: third_party/shadcn_flutter
  # Linux -Werror: fix uninitialized rates[0] in refresh_rate 1.0.2.
  refresh_rate:
    path: third_party/refresh_rate

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/themes/
