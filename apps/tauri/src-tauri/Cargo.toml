[package]
name = "querya_desktop_tauri"
version = "0.1.0"
description = "Querya Desktop (Tauri 2)"
authors = ["QueryaHub"]
edition = "2021"

[lib]
name = "querya_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "querya-mcp"
path = "src/bin/querya_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "io-std", "process"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "mysql",
  "json",
  "chrono",
  "rust_decimal",
  "uuid",
  "ipnetwork",
  "mac_address",
  "bit-vec",
] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
sqlparser = "0.64"
rust_decimal = { version = "1", features = ["serde"] }
# Pin to sqlx 0.8's dependency versions so Decode impls match.
ipnetwork = "0.20"
mac_address = "1.1"
bit-vec = "0.6.3"
redis = { version = "0.27", features = ["aio", "tokio-comp"] }
mongodb = "3.10.1"
russh = { version = "0.65.1", features = ["default"] }
rand = "0.10.4"
rmcp = { version = "3.10.0", features = ["macros", "schemars", "server", "transport-async-rw"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
