name: Dev Container Feature

# Tests and publishes ghcr.io/queryahub/features/querya-ext-tester
# (devcontainer-features/src). The tester is a glibc binary, so only
# Debian-family bases are tested. Pull requests only test; the Feature is pushed
# from main/dev or by hand.
on:
  push:
    branches: [main, dev]
    paths:
      - devcontainer-features/**
      - .github/workflows/devcontainer-feature.yml
  pull_request:
    paths:
      - devcontainer-features/**
      - .github/workflows/devcontainer-feature.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test querya-ext-tester Feature (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Dev Containers CLI
        run: npm install -g @devcontainers/cli@0.80.0
      - name: Autogenerated tests (default options)
        run: |
          devcontainer features test \
            --features querya-ext-tester \
            --base-image "${{ matrix.base }}" \
            --project-folder devcontainer-features
      - name: Scenarios
        if: matrix.base == 'mcr.microsoft.com/devcontainers/base:ubuntu'
        run: |
          devcontainer features test \
            --features querya-ext-tester \
            --skip-autogenerated \
            --project-folder devcontainer-features

  publish:
    name: Publish Feature
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: ./devcontainer-features/src
          features-namespace: queryahub/features
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
