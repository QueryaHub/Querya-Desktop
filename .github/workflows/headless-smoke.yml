name: Headless smoke (L2)

# Builds the Linux bundle and runs the real app under Xvfb in portable mode with
# scripts/dev/headless_app.sh: it has to start, show a window and stay up. The
# screenshot is kept as an artifact. Not part of ci.yml: a Linux build takes
# minutes, so this runs when the script or this file changes, weekly, and on
# demand.
on:
  pull_request:
    paths:
      - scripts/dev/headless_app.sh
      - .github/workflows/headless-smoke.yml
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: App under Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev xvfb xdotool imagemagick

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Run the app headless
        run: |
          mkdir -p build/headless
          scripts/dev/headless_app.sh \
            --bundle build/linux/x64/release/bundle \
            --screenshot build/headless/screenshot.png \
            --log build/headless/app.log \
            --wait 90 --keep 5

      - name: Keep the screenshot and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke
          path: build/headless/
          if-no-files-found: ignore
          retention-days: 14
